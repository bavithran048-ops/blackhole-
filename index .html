<body>

<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
const $=id=>document.getElementById(id),ui={score:$('score'),best:$('best'),timer:$('timer'),timerPill:$('timerPill'),world:$('worldName'),fill:$('growthFill'),combo:$('combo'),comboValue:$('comboValue'),overlay:$('overlay'),title:$('overlayTitle'),eyebrow:$('eyebrow'),subtitle:$('overlaySubtitle'),play:$('playBtn'),helper:$('helper'),scoreLine:$('scoreLine'),finalScore:$('finalScore'),finalBest:$('finalBest'),chips:$('worldChips'),tip:$('tip'),power:$('powerBadge'),sound:$('soundBtn')};
const WORLDS=[{name:'CITY',unlock:0,sky:['#182342','#27395a'],ground:'#304c63',line:'#8bd7c4',accent:'#ffd369',objects:['coin','apple','box','rock','tree','car','bus']},{name:'FARM',unlock:120,sky:['#356a71','#a3c98a'],ground:'#577d53',line:'#d2ef9b',accent:'#ffe58b',objects:['coin','apple','box','rock','tree','cow','tractor','barn']},{name:'VOLCANO',unlock:360,sky:['#321b43','#843c49'],ground:'#4c3046',line:'#ff9a6a',accent:'#ffc56f',objects:['coin','rock','crystal','tree','boulder','lava','crater','obelisk']},{name:'SPACE',unlock:750,sky:['#090f2b','#242657'],ground:'#24254c',line:'#9b99ff',accent:'#71f4ee',objects:['coin','crystal','rock','planet','satellite','asteroid','comet','moon']}];
const DEFINITIONS={coin:{r:6,v:5,c:'#ffdc65',shape:'coin'},apple:{r:10,v:9,c:'#ff5f76',shape:'apple'},box:{r:14,v:15,c:'#ca8b58',shape:'box'},rock:{r:19,v:23,c:'#8795ae',shape:'rock'},tree:{r:26,v:34,c:'#50c88d',shape:'tree'},car:{r:34,v:50,c:'#ff7589',shape:'car'},bus:{r:47,v:72,c:'#f4bd55',shape:'bus'},cow:{r:25,v:35,c:'#e8e7d8',shape:'cow'},tractor:{r:36,v:58,c:'#83c85f',shape:'tractor'},barn:{r:49,v:83,c:'#dd686a',shape:'barn'},crystal:{r:23,v:41,c:'#8ee6ff',shape:'crystal'},boulder:{r:39,v:72,c:'#9d829f',shape:'rock'},lava:{r:31,v:59,c:'#ff754d',shape:'lava'},crater:{r:48,v:92,c:'#bd5960',shape:'crater'},obelisk:{r:55,v:112,c:'#d17aff',shape:'obelisk'},planet:{r:43,v:94,c:'#b28dff',shape:'planet'},satellite:{r:28,v:72,c:'#80e9ff',shape:'satellite'},asteroid:{r:52,v:120,c:'#baa2a4',shape:'rock'},comet:{r:35,v:82,c:'#93eaff',shape:'comet'},moon:{r:61,v:145,c:'#ece8d8',shape:'moon'}};
const POWERUPS=[{kind:'magnet',name:'MAGNET',color:'#ff72bd',glyph:'✣'},{kind:'double',name:'2× SCORE',color:'#ffd369',glyph:'×2'},{kind:'grow',name:'GROW',color:'#70f4ed',glyph:'↗'},{kind:'time',name:'+8 SECONDS',color:'#a2f28a',glyph:'+8'}];
let w=innerWidth,h=innerHeight,dpr=1,raf=0,last=0,elapsed=0,timeLeft=60,score=0,best=+localStorage.getItem('blackHoleBest')||0,unlocked=+localStorage.getItem('blackHoleWorlds')||0;
let running=false,paused=false,gameOver=false,soundOn=true,audio=null,objects=[],particles=[],stars=[],decor=[],keys={},pointer={x:innerWidth/2,y:innerHeight/2,down:false,active:false},hole={x:innerWidth/2,y:innerHeight/2,r:18,targetR:18,baseR:18},spawnClock=0,powerClock=8,comboCount=0,comboUntil=0,lastAbsorb=0,shake=0,worldIndex=0,worldBanner=0,worldBannerName='',powerTimers={magnet:0,double:0,grow:0},uiClock=0,roundBestAtStart=best;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),now=()=>performance.now()/1000;
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);hole.x=clamp(hole.x,30,w-30);hole.y=clamp(hole.y,60,h-40);makeBackdrop();if(!running)draw()}
function makeBackdrop(){stars=Array.from({length:Math.min(90,Math.round(w*h/11500))},()=>({x:Math.random()*w,y:Math.random()*h,r:rand(.5,1.7),p:rand(0,6.28)}));decor=[];for(let i=0;i<28;i++)decor.push({x:Math.random()*w,y:Math.random()*h,size:rand(18,75),seed:Math.random()*9})}
function chooseWorld(){let idx=0;for(let i=0;i<WORLDS.length;i++)if(score>=WORLDS[i].unlock)idx=i;if(idx>unlocked){unlocked=idx;localStorage.setItem('blackHoleWorlds',String(unlocked))}if(idx!==worldIndex){worldIndex=idx;worldBanner=2.3;worldBannerName=WORLDS[idx].name;shake=Math.max(shake,3)}return WORLDS[idx]}
function objSpec(){let world=chooseWorld(),max=hole.r+18+elapsed*.11,available=world.objects.map(k=>[k,DEFINITIONS[k]]).filter(([k,d])=>d.r<max);if(!available.length)available=[['coin',DEFINITIONS.coin]];let weighted=[];for(const pair of available){let [,d]=pair;let weight=Math.max(1,Math.pow(Math.max(1,max-d.r),.4));for(let n=0;n<Math.min(9,Math.ceil(weight));n++)weighted.push(pair)}return weighted[Math.floor(Math.random()*weighted.length)]}
function spawnObject(){let spec=objSpec(),kind=spec[0],def=spec[1],a=rand(0,Math.PI*2),rad=rand(Math.max(w,h)*.26,Math.max(w,h)*.66),x=hole.x+Math.cos(a)*rad,y=hole.y+Math.sin(a)*rad;if(x<def.r+8||x>w-def.r-8||y<90||y>h-def.r-55){x=rand(def.r+8,w-def.r-8);y=rand(100,Math.max(110,h-def.r-60))}if(Math.hypot(x-hole.x,y-hole.y)<hole.r+def.r+45){x=clamp(x+(x>hole.x?1:-1)*(hole.r+def.r+50),def.r+8,w-def.r-8);y=clamp(y+(y>hole.y?1:-1)*42,95,h-def.r-50)}objects.push({kind,x,y,r:def.r,v:def.v,c:def.c,shape:def.shape,phase:Math.random()*6.28,rot:rand(-.15,.15),vx:rand(-5,5),vy:rand(-5,5),state:'idle',life:rand(0,4)})}
function spawnPower(){let p=POWERUPS[Math.floor(Math.random()*POWERUPS.length)],a=Math.random()*6.28,r=rand(Math.max(w,h)*.3,Math.max(w,h)*.58);objects.push({kind:'power',power:p.kind,label:p.name,glyph:p.glyph,x:clamp(hole.x+Math.cos(a)*r,22,w-22),y:clamp(hole.y+Math.sin(a)*r,92,h-48),r:14,v:0,c:p.color,shape:'power',phase:Math.random()*6,state:'idle',life:0})}
function reset(){score=0;roundBestAtStart=best;elapsed=0;timeLeft=60;comboCount=0;comboUntil=0;lastAbsorb=0;objects=[];particles=[];powerTimers={magnet:0,double:0,grow:0};hole={x:w*.5,y:h*.56,r:18,targetR:18,baseR:18};worldIndex=0;worldBanner=0;spawnClock=0;powerClock=7;shake=0;for(let i=0;i<Math.max(44,Math.min(86,Math.floor(w*h/11000)));i++)spawnObject();for(let i=0;i<3;i++)spawnPower();ui.score.textContent='0';ui.timer.textContent='60';ui.timerPill.classList.remove('urgent');ui.tip.classList.remove('off');ui.power.classList.remove('on');renderHUD();chooseWorld()}
function start(){buttonSound();reset();running=true;paused=false;gameOver=false;ui.overlay.classList.add('hidden');last=performance.now();pointer.x=w/2;pointer.y=h*.55;pointer.active=false;if(!raf)raf=requestAnimationFrame(loop)}
function endGame(){running=false;gameOver=true;timeLeft=0;ui.timer.textContent='0';ui.timerPill.classList.remove('urgent');if(score>best){best=score;localStorage.setItem('blackHoleBest',String(best))}ui.best.textContent=best;ui.finalScore.textContent=score;ui.finalBest.textContent=best;ui.eyebrow.textContent='ROUND COMPLETE';ui.title.innerHTML='TIME <i>UP</i>';ui.subtitle.textContent=score>roundBestAtStart?'New personal best — the void is legendary.':'The universe is still full of snacks.';ui.scoreLine.hidden=false;ui.play.textContent='PLAY AGAIN';ui.helper.textContent='Your best run is saved on this device';showWorldChips();ui.overlay.classList.remove('hidden');playTone(170,.42,'sawtooth',.075)}
function showWorldChips(){ui.chips.innerHTML=WORLDS.map((world,i)=>`<span class="worldchip ${i<=unlocked?'unlocked':''}">${['🏙','🌾','🌋','✦'][i]} ${world.name}${i>unlocked?' · LOCKED':''}</span>`).join('')}
function showStart(){running=false;gameOver=false;ui.eyebrow.textContent='COSMIC CLEANUP';ui.title.innerHTML='BLACK <i>HOLE</i>';ui.subtitle.innerHTML='A tiny void. A whole world to eat.<br>Get bigger before time runs out.';ui.scoreLine.hidden=true;ui.play.textContent='PLAY';ui.helper.innerHTML='Drag to move · Mouse or WASD on desktop<br>Absorb only what’s smaller than you';showWorldChips();ui.best.textContent=best;ui.overlay.classList.remove('hidden')}
function renderHUD(){ui.score.textContent=score;ui.best.textContent=best;let max=88,min=18,prog=clamp((hole.baseR-min)/(max-min),0,1);ui.fill.style.width=(6+prog*94)+'%';ui.world.textContent=WORLDS[worldIndex].name;ui.timer.textContent=Math.ceil(timeLeft);ui.timerPill.classList.toggle('urgent',timeLeft<10);if(comboCount>1&&now()<comboUntil){ui.comboValue.textContent='×'+Math.min(comboCount,9);ui.combo.classList.add('on')}else ui.combo.classList.remove('on');let active=[];if(powerTimers.magnet>0)active.push('MAGNET');if(powerTimers.double>0)active.push('2× SCORE');if(powerTimers.grow>0)active.push('GROW');ui.power.textContent=active.map(n=>n+' '+Math.ceil(powerTimers[n==='2× SCORE'?'double':n.toLowerCase()])+'s').join('  ·  ');ui.power.classList.toggle('on',active.length>0)}
function addParticle(x,y,color,n=9,power=1){for(let i=0;i<n;i++){let a=Math.random()*6.283,s=rand(28,155)*power;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rand(1.5,4)*power,life:rand(.32,.8),max:.8,c:color})}}
function absorb(o){o.state='suck';o.suck=0;o.startX=o.x;o.startY=o.y;o.startR=o.r;comboCount=now()-lastAbsorb<1.3?comboCount+1:1;lastAbsorb=now();comboUntil=now()+1.45;shake=Math.max(shake,Math.min(7,o.r*.14));if(comboCount>=3)playTone(650+comboCount*70,.12,'triangle',.04);else playTone(310+o.r*8,.11,'sine',.045);}
function finishAbsorb(o){if(o.kind==='power'){activatePower(o.power);addParticle(o.x,o.y,o.c,18,1.15);o.dead=true;return}let mult=powerTimers.double>0?2:1;let comboMult=comboCount>=5?3:comboCount>=3?2:1;let points=o.v*mult*comboMult;score+=points;hole.baseR=clamp(hole.baseR+Math.max(.24,Math.sqrt(o.v)*.13),18,100);hole.targetR=hole.baseR+(powerTimers.grow>0?13:0);ui.tip.classList.add('off');addParticle(hole.x,hole.y,o.c,Math.min(18,8+Math.floor(o.r/5)),.9);if(comboCount>=3){shake=Math.max(shake,comboCount>=5?8:4);popCombo()}chooseWorld();if(score>best){best=score;localStorage.setItem('blackHoleBest',String(best));ui.best.textContent=best}o.dead=true}

function activatePower(p){if(p==='magnet')powerTimers.magnet=8;else if(p==='double')powerTimers.double=9;else if(p==='grow'){powerTimers.grow=8;hole.targetR=hole.baseR+13}else if(p==='time')timeLeft+=8;playTone(520,.2,'sine',.07);setTimeout(()=>playTone(780,.18,'triangle',.045),45);ui.power.textContent=p==='time'?'+8 SECONDS':({magnet:'MAGNET',double:'DOUBLE SCORE',grow:'GROW'}[p]||'POWER UP');ui.power.classList.add('on')}
function moveHole(dt){let tx=pointer.x,ty=pointer.y;if(keys.ArrowLeft||keys.a)tx-=260*dt;if(keys.ArrowRight||keys.d)tx+=260*dt;if(keys.ArrowUp||keys.w)ty-=260*dt;if(keys.ArrowDown||keys.s)ty+=260*dt;tx=clamp(tx,20,w-20);ty=clamp(ty,75,h-24);if(pointer.active||Object.values(keys).some(Boolean)){let ease=1-Math.exp(-dt*12);hole.x+=(tx-hole.x)*ease;hole.y+=(ty-hole.y)*ease}hole.targetR=hole.baseR+(powerTimers.grow>0?13:0);hole.r+=(hole.targetR-hole.r)*(1-Math.exp(-dt*7))}
function update(dt){elapsed+=dt;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;endGame();return}for(const k in powerTimers)powerTimers[k]=Math.max(0,powerTimers[k]-dt);if(powerTimers.grow===0)hole.targetR=hole.baseR;moveHole(dt);let difficulty=1+elapsed/90;spawnClock+=dt;let spawnEvery=Math.max(.23,.68/difficulty);while(spawnClock>spawnEvery&&objects.length<155){spawnClock-=spawnEvery;spawnObject()}powerClock-=dt;if(powerClock<=0&&objects.filter(o=>o.kind==='power'&&!o.dead).length<2){spawnPower();powerClock=rand(11,16)}
for(let i=objects.length-1;i>=0;i--){let o=objects[i];o.life+=dt;if(o.state==='suck'){o.suck+=dt;let t=clamp(o.suck/.28,0,1),e=1-Math.pow(1-t,3);o.x=o.startX+(hole.x-o.startX)*e;o.y=o.startY+(hole.y-o.startY)*e;o.r=o.startR*(1-e*.88);if(t>=1){finishAbsorb(o);objects.splice(i,1)}continue}if(o.dead){objects.splice(i,1);continue}o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=Math.pow(.2,dt);o.vy*=Math.pow(.2,dt);if(o.x<o.r||o.x>w-o.r)o.vx+=(o.x<o.r?1:-1)*22*dt;if(o.y<88+o.r||o.y>h-45-o.r)o.vy+=(o.y<88+o.r?1:-1)*22*dt;
if(powerTimers.magnet>0&&o.kind!=='power'){let dx=hole.x-o.x,dy=hole.y-o.y,d=Math.hypot(dx,dy);if(d<Math.min(210,w*.48)&&d>1){let pull=(1-d/Math.min(210,w*.48))*150;o.vx+=dx/d*pull*dt;o.vy+=dy/d*pull*dt}}

for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.1,dt);p.vy*=Math.pow(.1,dt);if(p.life<=0)particles.splice(i,1)}if(worldBanner>0)worldBanner-=dt;shake=Math.max(0,shake-dt*17);uiClock+=dt;if(uiClock>.08){renderHUD();uiClock=0}}
function drawBg(t){let world=WORLDS[worldIndex],g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,world.sky[0]);g.addColorStop(1,world.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(const s of stars){let a=.28+.5*(.5+.5*Math.sin(t*1.3+s.p));ctx.globalAlpha=a;ctx.fillStyle='#e9f6ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;

function roundedRect(x,y,ww,hh,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawObj(o,t){let pulse=1+Math.sin(t*2.4+o.phase)*.035,r=o.r*pulse;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot+Math.sin(t*.6+o.phase)*.035);ctx.globalAlpha=o.state==='suck'?1:1;
if(o.shape==='power'){let color=o.c;ctx.shadowColor=color;ctx.shadowBlur=20;ctx.fillStyle=color+'35';ctx.beginPath();ctx.arc(0,0,r+5+Math.sin(t*5+o.phase)*2,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#15182f';ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.font=`bold ${Math.max(11,r*1.03)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.glyph,0,1);ctx.restore();return}

case'apple':ctx.beginPath();ctx.moveTo(0,-r*.65);ctx.bezierCurveTo(r*1.05,-r*1.1,r*1.05,r*.25,0,r*.85);ctx.bezierCurveTo(-r*1.05,r*.25,-r*1.05,-r*1.1,0,-r*.65);ctx.fill();ctx.fillStyle='#71dc87';ctx.beginPath();ctx.ellipse(r*.28,-r*.89,r*.32,r*.14,-.45,0,7);ctx.fill();ctx.strokeStyle='#8d5a3f';ctx.lineWidth=Math.max(1,r*.1);ctx.beginPath();ctx.moveTo(0,-r*.65);ctx.lineTo(r*.05,-r*.99);ctx.stroke();break;
case'box':roundedRect(-r*.8,-r*.66,r*1.6,r*1.32,r*.12,'#b97848','#edbd7b');ctx.strokeStyle='#f5d094';ctx.lineWidth=Math.max(1,r*.08);ctx.beginPath();ctx.moveTo(-r*.78,-r*.14);ctx.lineTo(r*.78,-r*.14);ctx.moveTo(0,-r*.65);ctx.lineTo(0,r*.65);ctx.stroke();break;
case'tree':ctx.fillStyle='#8d6049';ctx.fillRect(-r*.17,r*.12,r*.34,r*.7);for(let j=0;j<3;j++){ctx.fillStyle=j===0?'#42c98d':j===1?'#35b47f':'#62dc9d';ctx.beginPath();ctx.arc((j-1)*r*.42,-r*.13,r*.5,0,7);ctx.fill()}break;
case'car':case'bus':case'tractor':{let ww=r*(o.shape==='bus'?1.8:1.75),hh=r*(o.shape==='bus'?.85:.74);roundedRect(-ww/2,-hh/2,ww,hh,hh*.23,o.c,'#ffffff88');ctx.fillStyle='#b8edff';roundedRect(-ww*.3,-hh*.36,ww*.6,hh*.3,hh*.1,'#b8edff');ctx.fillStyle='#171b30';for(let s of [-1,1]){ctx.beginPath();ctx.arc(s*ww*.29,hh*.4,hh*.19,0,7);ctx.fill()}if(o.shape==='tractor'){ctx.fillStyle='#20263d';ctx.fillRect(-ww*.43,-hh*.13,ww*.2,hh*.37)}break}
case'cow':ctx.fillStyle='#f5f0db';ctx.beginPath();ctx.ellipse(0,0,r*1.03,r*.68,0,0,7);ctx.fill();ctx.fillStyle='#536078';ctx.beginPath();ctx.ellipse(-r*.28,-r*.12,r*.28,r*.25,0,0,7);ctx.ellipse(r*.4,r*.12,r*.22,r*.2,0,0,7);ctx.fill();ctx.fillStyle='#f5f0db';ctx.beginPath();ctx.arc(r*.82,-r*.15,r*.32,0,7);ctx.fill();ctx.fillStyle='#25334a';ctx.beginPath();ctx.arc(r*.93,-r*.2,r*.045,0,7);ctx.fill();break;
case'barn':ctx.fillStyle=o.c;ctx.beginPath();ctx.moveTo(-r*.82,-r*.18);ctx.lineTo(0,-r*.88);ctx.lineTo(r*.82,-r*.18);ctx.lineTo(r*.7,r*.65);ctx.lineTo(-r*.7,r*.65);ctx.closePath();ctx.fill();ctx.fillStyle='#5a3540';ctx.fillRect(-r*.28,r*.02,r*.56,r*.62);ctx.strokeStyle='#f4c4a0';ctx.lineWidth=r*.08;ctx.beginPath();ctx.moveTo(-r*.27,r*.05);ctx.lineTo(r*.27,r*.62);ctx.moveTo(r*.27,r*.05);ctx.lineTo(-r*.27,r*.62);ctx.stroke();break;
case'crystal':ctx.fillStyle=o.c;ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r*.7,-r*.2);ctx.lineTo(r*.48,r*.8);ctx.lineTo(-r*.42,r*.72);ctx.lineTo(-r*.7,-r*.1);ctx.closePath();ctx.fill();ctx.fillStyle='#ffffff9c';ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(0,r*.55);ctx.lineTo(-r*.42,r*.72);ctx.lineTo(-r*.7,-r*.1);ctx.closePath();ctx.fill();break;
case'lava':ctx.fillStyle='#45243f';ctx.beginPath();ctx.ellipse(0,r*.18,r,r*.62,0,0,7);ctx.fill();ctx.fillStyle=o.c;ctx.beginPath();ctx.ellipse(0,r*.1,r*.6,r*.31,0,0,7);ctx.fill();ctx.fillStyle='#ffe28a';ctx.beginPath();ctx.arc(-r*.2,0,r*.12,0,7);ctx.fill();break;

case'planet':ctx.fillStyle='#ffc5f1';ctx.beginPath();ctx.ellipse(0,0,r*1.45,r*.35,-.28,0,7);ctx.strokeStyle='#e6c7ff';ctx.lineWidth=r*.16;ctx.stroke();ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(0,0,r*.68,0,7);ctx.fill();ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.arc(-r*.19,-r*.15,r*.12,0,7);ctx.fill();break;

case'comet':ctx.globalAlpha=.45;ctx.fillStyle=o.c;ctx.beginPath();ctx.moveTo(-r*.2,0);ctx.lineTo(-r*1.7,-r*.4);ctx.lineTo(-r*1.15,r*.28);ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=o.c;ctx.beginPath();ctx.arc(r*.08,0,r*.62,0,7);ctx.fill();break;

function drawHole(t){let r=hole.r;ctx.save();ctx.globalCompositeOperation='lighter';let glow=ctx.createRadialGradient(hole.x,hole.y,r*.38,hole.x,hole.y,r*1.65);glow.addColorStop(0,'#00000000');glow.addColorStop(.58,'#70f4ed18');glow.addColorStop(.8,'#70f4ed35');glow.addColorStop(1,'#70f4ed00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(hole.x,hole.y,r*1.65,0,7);ctx.fill();ctx.strokeStyle='#8ff9eb';ctx.globalAlpha=.45+.18*Math.sin(t*3);ctx.lineWidth=Math.max(1.5,r*.065);ctx.beginPath();ctx.arc(hole.x,hole.y,r*1.07,0,7);ctx.stroke();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
let g=ctx.createRadialGradient(hole.x-r*.23,hole.y-r*.27,0,hole.x,hole.y,r);g.addColorStop(0,'#252743');g.addColorStop(.28,'#121528');g.addColorStop(.68,'#080a16');g.addColorStop(1,'#02030a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(hole.x,hole.y,r,0,7);ctx.fill();ctx.strokeStyle='#ffffff20';ctx.lineWidth=1;ctx.stroke();ctx.save();ctx.beginPath();ctx.arc(hole.x,hole.y,r*.93,0,7);ctx.clip();for(let i=0;i<4;i++){ctx.strokeStyle=`rgba(112,244,237,${.05-i*.008})`;ctx.lineWidth=Math.max(1,r*.08);ctx.beginPath();ctx.ellipse(hole.x,hole.y,r*(.39+i*.14),r*(.28+i*.12),t*.22+i,0,7);ctx.stroke()}ctx.restore();ctx.restore()}
function draw(t){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawBg(t);for(const o of objects)drawObj(o,t);for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.r*clamp(p.life/p.max,.1,1),0,7);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;drawHole(t);if(worldBanner>0){let a=Math.min(1,worldBanner*2);ctx.globalAlpha=a;ctx.textAlign='center';ctx.font=`900 ${Math.min(25,w*.06)}px system-ui`;ctx.fillStyle='#ffffff';ctx.shadowColor='#000';ctx.shadowBlur=14;ctx.fillText(worldBannerName+' WORLD',w/2,h*.28);ctx.shadowBlur=0;ctx.globalAlpha=1}ctx.restore()}
function loop(ts){raf=0;if(!running)return;let dt=Math.min(.035,(ts-last)/1000||.016);last=ts;update(dt);if(running)draw(ts/1000);if(running)raf=requestAnimationFrame(loop)}
function pointerPos(e){let r=canvas.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top}
canvas.addEventListener('pointerdown',e=>{pointerPos(e);pointer.down=true;pointer.active=true;try{canvas.setPointerCapture(e.pointerId)}catch{}ui.tip.classList.add('off')});canvas.addEventListener('pointermove',e=>{pointerPos(e);if(e.pointerType==='mouse'){pointer.active=true;ui.tip.classList.add('off')}});canvas.addEventListener('pointerup',()=>{pointer.down=false});canvas.addEventListener('pointercancel',()=>{pointer.down=false});canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;keys[e.key.toLowerCase()]=true;pointer.active=true;ui.tip.classList.add('off')},{passive:false});window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});window.addEventListener('blur',()=>{for(let k in keys)keys[k]=false});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;paused=true;if(raf){cancelAnimationFrame(raf);raf=0}ui.eyebrow.textContent='TAKE A BREATH';ui.title.innerHTML='GAME <i>PAUSED</i>';ui.subtitle.textContent='Your run is safe. Jump back in when you’re ready.';ui.scoreLine.hidden=true;ui.play.textContent='RESUME';ui.helper.textContent='';ui.overlay.classList.remove('hidden')} });
function resume(){if(!paused)return;buttonSound();paused=false;running=true;ui.overlay.classList.add('hidden');last=performance.now();if(!raf)raf=requestAnimationFrame(loop)}
function playTone(freq,duration,type='sine',gain=.05){if(!soundOn)return;try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(70,freq*.62),audio.currentTime+duration);g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}
function buttonSound(){playTone(420,.07,'sine',.035)}
ui.play.addEventListener('click',()=>paused?resume():start());ui.sound.addEventListener('click',()=>{soundOn=!soundOn;ui.sound.textContent=soundOn?'♫':'♪';ui.sound.style.color=soundOn?'':'#9299b5';ui.sound.setAttribute('aria-label',soundOn?'Mute sound':'Enable sound');if(soundOn)buttonSound()});window.addEventListener('resize',resize,{passive:true});
resize();ui.best.textContent=best;showStart();draw(0);
